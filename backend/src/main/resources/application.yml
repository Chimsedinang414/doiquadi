spring:
  application:
    name: LocalFood Backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET}
            scope: email,public_profile
          apple:
            provider: apple
            client-id: ${APPLE_CLIENT_ID}
            client-secret: ${APPLE_CLIENT_SECRET:generated-at-runtime}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: {baseUrl}/login/oauth2/code/{registrationId}
            scope: openid,name,email
        provider:
          apple:
            issuer-uri: https://appleid.apple.com
            user-name-attribute: sub

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  forward-headers-strategy: framework

logging:
  level:
    root: INFO
    com.localfood: ${APP_LOG_LEVEL:INFO}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    # Base64-encoded random value containing at least 32 bytes.
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:localfood-api}
    audience: ${JWT_AUDIENCE:localfood-web}
    access-token-ttl: ${JWT_ACCESS_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TTL:P7D}
  oauth2:
    frontend-redirect-uri: ${OAUTH2_FRONTEND_REDIRECT_URI:http://localhost:5173/oauth2/callback}
    auto-link-verified-email: ${OAUTH2_AUTO_LINK_VERIFIED_EMAIL:false}
    authorization-cookie-secure: ${OAUTH2_COOKIE_SECURE:true}
    authorization-cookie-ttl: ${OAUTH2_COOKIE_TTL:PT5M}
    login-code-ttl: ${OAUTH2_LOGIN_CODE_TTL:PT1M}
  apple:
    team-id: ${APPLE_TEAM_ID}
    key-id: ${APPLE_KEY_ID}
    client-id: ${APPLE_CLIENT_ID}
    # PKCS#8 P-256 private key, PEM text or Base64 DER. Never commit the .p8 file.
    private-key: ${APPLE_PRIVATE_KEY}
    client-secret-ttl: ${APPLE_CLIENT_SECRET_TTL:PT5M}
  storage:
    enabled: ${STORAGE_ENABLED:false}
    endpoint: ${STORAGE_ENDPOINT:}
    region: ${STORAGE_REGION:auto}
    bucket: ${STORAGE_BUCKET:}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}
    path-style-access: ${STORAGE_PATH_STYLE:true}
    presign-seconds: ${STORAGE_PRESIGN_SECONDS:300}
    max-file-size: ${STORAGE_MAX_FILE_SIZE:10485760}
