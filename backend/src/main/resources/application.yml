spring:
  application:
    name: LocalFood Backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/doiquadi}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:142857}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  devtools:
    restart:
      exclude: static/**,public/**

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.localfood: DEBUG

app:
  storage:
    enabled: ${STORAGE_ENABLED:false}
    endpoint: ${STORAGE_ENDPOINT:}
    region: ${STORAGE_REGION:auto}
    bucket: ${STORAGE_BUCKET:}
    access-key: ${STORAGE_ACCESS_KEY:}
    secret-key: ${STORAGE_SECRET_KEY:}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:}
    path-style-access: ${STORAGE_PATH_STYLE:true}
    presign-seconds: ${STORAGE_PRESIGN_SECONDS:300}
    max-file-size: ${STORAGE_MAX_FILE_SIZE:10485760}
